name: Validate React source

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-homepage.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/build-homepage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Type-check and build
        working-directory: app
        run: npm run build
