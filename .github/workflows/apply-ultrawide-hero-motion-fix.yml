name: Apply ultrawide hero motion fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-ultrawide-hero-motion-fix.yml'

permissions:
  contents: write

jobs:
  patch-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch slideshow motion and ultrawide rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('script.js')
          style_path = Path('styles.css')
          index_path = Path('index.html')

          script = script_path.read_text(encoding='utf-8')

          old_interval = '''const heroInterval = 5600;
          let activeHeroIndex = 0;'''
          new_interval = '''const heroInterval = 5600;
          const reducedHeroInterval = 8600;
          let activeHeroIndex = 0;'''
          if old_interval not in script:
              raise SystemExit('Could not find hero interval block')
          script = script.replace(old_interval, new_interval, 1)

          old_visibility = '''let heroIsVisible = true;
          function formatIndex(index) {'''
          new_visibility = '''let heroIsVisible = true;
          function heroInViewport() {
          if (!hero) return true;
          const rect = hero.getBoundingClientRect();
          return rect.bottom > 0 && rect.top < window.innerHeight;
          }
          function formatIndex(index) {'''
          if old_visibility not in script:
              raise SystemExit('Could not find hero visibility block')
          script = script.replace(old_visibility, new_visibility, 1)

          old_timer = '''function startHeroTimer() {
          stopHeroTimer();
          if (reducedMotion() || !heroIsVisible || document.hidden || heroSlides.length < 2) return;
          heroTimer = window.setInterval(() => setHeroSlide(activeHeroIndex + 1, false), heroInterval);
          }'''
          new_timer = '''function startHeroTimer() {
          stopHeroTimer();
          if ((!heroIsVisible && !heroInViewport()) || document.hidden || heroSlides.length < 2) return;
          const interval = reducedMotion() ? reducedHeroInterval : heroInterval;
          heroTimer = window.setInterval(() => setHeroSlide(activeHeroIndex + 1, false), interval);
          }'''
          if old_timer not in script:
              raise SystemExit('Could not find hero timer block')
          script = script.replace(old_timer, new_timer, 1)

          old_observer_end = '''heroObserver.observe(hero);
          }
          document.addEventListener("visibilitychange", () => {'''
          new_observer_end = '''heroObserver.observe(hero);
          }
          window.addEventListener("resize", () => {
          heroIsVisible = heroInViewport();
          startHeroTimer();
          }, { passive: true });
          document.addEventListener("visibilitychange", () => {'''
          if old_observer_end not in script:
              raise SystemExit('Could not find hero observer block')
          script = script.replace(old_observer_end, new_observer_end, 1)
          script_path.write_text(script, encoding='utf-8')

          styles = style_path.read_text(encoding='utf-8')
          marker = '/* Ultrawide hero motion resilience / 20260803 */'
          if marker not in styles:
              styles += '''

          /* Ultrawide hero motion resilience / 20260803 */
          @media (prefers-reduced-motion: reduce) {
          .hero-slide {
          transition: opacity 680ms ease !important;
          transform: none !important;
          }
          .hero-slide.is-active {
          transform: none !important;
          }
          .hero-slide img {
          transform: none !important;
          }
          }
          @media (min-width: 1600px) and (min-aspect-ratio: 21/9) {
          .hero-slide,
          .hero-slide.is-active {
          transform: none;
          }
          .hero-slide {
          transition: opacity 1400ms var(--ease-smooth);
          }
          .hero-slide img {
          backface-visibility: hidden;
          transition: transform 7600ms linear;
          }
          .hero-slide.is-active img {
          transform: translate3d(0, var(--hero-parallax, 0px), 0) scale(1.055);
          }
          }
          '''
          style_path.write_text(styles, encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          index = index.replace('styles.css?v=20260803-editorial', 'styles.css?v=20260803-ultrawide-motion')
          index = index.replace('script.js?v=20260803-editorial', 'script.js?v=20260803-ultrawide-motion')
          if '20260803-ultrawide-motion' not in index:
              raise SystemExit('Could not update cache-busting version')
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Validate patched files
        shell: bash
        run: |
          node --check script.js
          python3 - <<'PY'
          from pathlib import Path
          script = Path('script.js').read_text(encoding='utf-8')
          styles = Path('styles.css').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')
          assert 'const reducedHeroInterval = 8600;' in script
          assert 'if ((!heroIsVisible && !heroInViewport())' in script
          assert 'transition: opacity 680ms ease !important;' in styles
          assert '@media (min-width: 1600px) and (min-aspect-ratio: 21/9)' in styles
          assert index.count('20260803-ultrawide-motion') == 2
          assert index.count('data-hero-slide') == 4
          print('Ultrawide hero motion patch validated')
          PY

      - name: Commit patched website
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css script.js
          git commit -m 'Fix hero animation on ultrawide desktop displays'
          git push origin main
