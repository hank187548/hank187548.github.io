name: Apply gallery grid fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-gallery-grid-fix.yml'

permissions:
  contents: write

jobs:
  patch-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix gallery grid gaps
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          style_path = Path('styles.css')
          index_path = Path('index.html')

          styles = style_path.read_text(encoding='utf-8')
          marker = '/* Gallery mosaic gap fix / 20260808 */'
          block = '''\n\n/* Gallery mosaic gap fix / 20260808 */\n@media (min-width: 721px) {\n  .media-grid {\n    grid-auto-rows: clamp(260px, 23vw, 320px);\n  }\n\n  .media-tile--video {\n    grid-row: span 1;\n  }\n\n  #italy-2026 .media-grid > .media-tile:last-child {\n    grid-column: 1 / -1;\n  }\n}\n'''
          if marker not in styles:
              styles = styles.rstrip() + block
          style_path.write_text(styles, encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          old = 'styles.css?v=20260808-hero-crop'
          new = 'styles.css?v=20260808-gallery-grid'
          if old not in index and new not in index:
              raise SystemExit('Unexpected stylesheet cache key')
          index = index.replace(old, new)
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Validate gallery fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          styles = Path('styles.css').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')

          assert styles.count('/* Gallery mosaic gap fix / 20260808 */') == 1
          assert '.media-tile--video {' in styles
          assert 'grid-row: span 1;' in styles
          assert '#italy-2026 .media-grid > .media-tile:last-child {' in styles
          assert 'grid-column: 1 / -1;' in styles
          assert 'styles.css?v=20260808-gallery-grid' in index
          assert '@media (max-width: 720px)' in styles
          print('Gallery grid fix validated')
          PY

      - name: Commit patched website
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css index.html
          git commit -m 'Fix gallery mosaic gaps'
          git push origin main
